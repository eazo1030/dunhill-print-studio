name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DunhillPrintStudio.exe
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: dotnet restore DunhillPrintStudio.csproj --verbosity normal 2>&1 | tee restore.log
        # tee keeps the log in the workspace so we can inspect on the next step if it fails

      - name: Build (verify compilation)
        run: dotnet build DunhillPrintStudio.csproj -c Release --no-restore 2>&1 | tee build.log

      - name: Publish single-file self-contained exe
        run: |
          dotnet publish DunhillPrintStudio.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishSingleFile=true `
            -p:SelfContained=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            --verbosity normal 2>&1 | tee publish.log

      - name: Verify exe exists
        shell: pwsh
        run: |
          $exe = "bin\Release\net8.0-windows10.0.19041.0\win-x64\publish\DunhillPrintStudio.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build did not produce expected exe at $exe"
            exit 1
          }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Built DunhillPrintStudio.exe ($size MB)"

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            restore.log
            build.log
            publish.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach to release (on tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin\Release\net8.0-windows10.0.19041.0\win-x64\publish\DunhillPrintStudio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
